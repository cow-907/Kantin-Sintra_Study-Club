<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Style lokal -->
  <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="app-shell">
  <div class="app-frame">
    <div class="container py-5" style="max-width: 1100px;">
  
  <!-- Header Judul -->
  <div class="d-flex align-items-center mb-4">
    <a href="Beranda.html" class="back-link text-dark me-3 d-inline-flex align-items-center text-decoration-none">
      <i class="bi bi-arrow-left fs-4" aria-hidden="true"></i>
      <span class="ms-2 d-none d-sm-inline">Kembali</span>
    </a>
    <h3 class="header-title mb-0">Keranjang Belanja</h3>
  </div>

  <div class="row g-4">
    
    <!-- Kolom Daftar Produk (Kiri) -->
    <div class="col-lg-8">
      
      <!-- Item 1: Es Teh -->
      <div class="cart-item-card">
        <div class="d-flex align-items-center justify-content-between">
          
          <div class="d-flex align-items-center gap-3">
            <img src="https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=300&q=80" 
                 alt="Es Teh" class="item-img">
            <div>
              <h5 class="fw-bold mb-1 fs-6">Es Teh</h5>
              <p class="text-muted small mb-2">Minuman</p>
              
              <!-- Kontrol Quantiti -->
              <div class="d-flex align-items-center gap-1">
                <button class="btn btn-qty" type="button">-</button>
                <input type="text" class="form-control qty-input p-0" value="4" readonly>
                <button class="btn btn-qty" type="button">+</button>
              </div>
            </div>
          </div>

          <div class="text-end d-flex flex-column justify-content-between align-items-end" style="height: 90px;">
            <i class="bi bi-trash trash-icon"></i>
            <div>
              <div class="unit-calc">Rp 5.000 × 4</div>
              <div class="price-green">Rp 20.000</div>
            </div>
          </div>

        </div>
      </div>

      <!-- Item 2: Pepperoni Pizza -->
      <div class="cart-item-card">
        <div class="d-flex align-items-center justify-content-between">
          
          <div class="d-flex align-items-center gap-3">
            <img src="https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=300&q=80" 
                 alt="Pepperoni Pizza" class="item-img">
            <div>
              <h5 class="fw-bold mb-1 fs-6">Pepperoni Pizza</h5>
              <p class="text-muted small mb-2">Makanan</p>
              
              <!-- Kontrol Quantiti -->
              <div class="d-flex align-items-center gap-1">
                <button class="btn btn-qty" type="button">-</button>
                <input type="text" class="form-control qty-input p-0" value="2" readonly>
                <button class="btn btn-qty" type="button">+</button>
              </div>
            </div>
          </div>

          <div class="text-end d-flex flex-column justify-content-between align-items-end" style="height: 90px;">
            <i class="bi bi-trash trash-icon"></i>
            <div>
              <div class="unit-calc">Rp 30.000 × 2</div>
              <div class="price-green">Rp 60.000</div>
            </div>
          </div>

        </div>
      </div>

    </div>

    <!-- Kolom Ringkasan Belanja (Kanan) -->
    <div class="col-lg-4">
      <div class="summary-card">
        <h5 class="fw-bold mb-4">Ringkasan Belanja</h5>
        
        <div class="d-flex justify-content-between mb-2">
          <span class="text-secondary small">Subtotal</span>
          <span class="fw-semibold small">Rp 80.000</span>
        </div>
        
        <div class="d-flex justify-content-between mb-3">
          <span class="text-secondary small">PPN 10%</span>
          <span class="small" style="color: #61c29e;">Rp 8.000</span>
        </div>
        
        <hr class="my-3" style="border-color: #eee;">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
          <span class="fw-bold fs-6">Total</span>
          <span class="price-green fs-5">Rp 88.000</span>
        </div>

        <a href="Checkout.html" class="btn btn-checkout mb-3 d-block text-center text-decoration-none">Lanjut ke Pembayaran</a>
        <a href="Daftar Menu.html" class="btn-continue">Lanjut Belanja</a>
      </div>
    </div>

  </div>
    </div>
  </div>
</div>

</body>
</html>
