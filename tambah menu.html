<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tambah Menu</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="food-card mx-auto" style="max-width:440px;">

  <div class="d-flex align-items-center justify-content-between mb-3">
    <h2 class="category-title font-heading m-0">Tambah Menu</h2>
    <a href="admin.html" class="icon-btn" style="width:36px; height:36px;" aria-label="Tutup">
      <i class="bi bi-x-lg"></i>
    </a>
  </div>

  <form>
    <div class="mb-3">
      <label class="form-label">Foto Menu</label>
      <label for="foto-menu" class="stock-box d-block text-center" style="cursor:pointer;">
        <i class="bi bi-cloud-arrow-up d-block mb-1" style="font-size:22px; color:var(--text-soft);"></i>
        <span class="d-block">Klik untuk upload foto</span>
        <span class="d-block unit-calc">JPG, PNG (maks. 2MB)</span>
        <input type="file" id="foto-menu" accept="image/png, image/jpeg" hidden>
      </label>
    </div>

    <div class="mb-3">
      <label class="form-label" for="nama-menu">Nama Menu</label>
      <input type="text" id="nama-menu" class="form-control" placeholder="Masukkan nama menu">
    </div>

    <div class="mb-3">
      <label class="form-label" for="kategori-menu">Kategori</label>
      <select id="kategori-menu" class="form-select">
        <option value="" selected>Pilih kategori</option>
        <option value="burger">Burger</option>
        <option value="pizza">Pizza</option>
        <option value="minuman">Minuman</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label" for="harga-menu">Harga</label>
      <div class="input-group">
        <span class="input-group-text">Rp</span>
        <input type="number" id="harga-menu" class="form-control" placeholder="Masukkan harga">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="deskripsi-menu">Deskripsi</label>
      <textarea id="deskripsi-menu" class="form-control" rows="3" placeholder="Masukkan deskripsi menu" style="resize:none;"></textarea>
    </div>

    <div class="mb-0">
      <label class="form-label" for="status-menu">Status</label>
      <select id="status-menu" class="form-select">
        <option value="aktif" selected>Aktif</option>
        <option value="nonaktif">Nonaktif</option>
      </select>
    </div>
  </form>

  <div class="d-flex justify-content-end gap-2 mt-4">
    <a href="admin.html" class="btn btn-outline-secondary">Batal</a>
    <a href="admin.html" class="btn-pesan" style="width:auto; padding:10px 22px;">Simpan</a>
  </div>

</div>

</body>
</html>
